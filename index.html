<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDGs</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    .sdg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 20px;
      padding: 4px;
    }

    .sdg-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: transparent;

      transition:
        transform 0.3s ease,
        filter 0.3s ease;
    }

    .sdg-card:hover,
    .sdg-card:focus-visible {
      transform: translateY(-6px) scale(1.02);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.18));
      outline: none;
    }

    .sdg-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .sdg-card {
        transition: none;
      }

      .sdg-card:hover,
      .sdg-card:focus-visible {
        transform: none;
        filter: none;
      }
    }
  </style>
</head>
